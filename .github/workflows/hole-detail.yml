# Fetches high-detail layers (green lidar ground points + aerial photo) for
# individual holes, on GitHub's servers, and commits them back to the branch.
#
# To run: on a branch named build/<anything>, edit HOLE_DETAIL_REQUEST.txt
# (lines of "<course_slug> <hole> <hole> ...") and push.
name: hole-detail
on:
  push:
    branches: ["build/**"]
    paths: ["HOLE_DETAIL_REQUEST.txt", ".github/workflows/hole-detail.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hole-detail-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Install PDAL
        continue-on-error: true
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdal
          create-args: pdal
          condarc: |
            channels: [conda-forge]
      - run: echo "PDAL_BIN=${MAMBA_ROOT_PREFIX:-$HOME/micromamba}/envs/pdal/bin/pdal" >> "$GITHUB_ENV"
      - name: Fetch hole detail
        run: |
          mkdir -p build-logs
          grep -v '^\s*#' HOLE_DETAIL_REQUEST.txt | tr -d '\r' | awk 'NF' | while read -r slug holes; do
            timeout 30m python3 tools/fetch_hole_detail.py --course "$slug" --holes $holes 2>&1 | tee "build-logs/${slug}_hole_detail.log" || true
          done
      - name: Commit results
        run: |
          git config user.name "goose-course-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -f courses/*/derived/holes build-logs 2>/dev/null || true
          git commit -q -m "Hole detail: $(grep -v '^\s*#' HOLE_DETAIL_REQUEST.txt | awk 'NF' | tr '\n' ' ')" || echo "nothing to commit"
          git pull -q --rebase || true
          git push -q
