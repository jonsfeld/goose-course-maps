# Builds course maps from public data (OpenStreetMap, USGS 3DEP lidar, NAIP)
# on GitHub's servers and commits the derived results back to the branch.
#
# To run: on a branch named build/<anything>, edit BUILD_REQUEST.txt
# (one course slug per line) and push. A new push cancels a run in progress.
name: build-courses
on:
  push:
    branches: ["build/**"]
    paths: ["BUILD_REQUEST.txt", ".github/workflows/build-courses.yml"]
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Install PDAL (point-cloud tool) — must never block the build
        continue-on-error: true
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdal
          create-args: pdal
          condarc: |
            channels: [conda-forge]
      - name: Point at the PDAL binary only (its env has its own Python; keep it off PATH)
        continue-on-error: true
        run: echo "PDAL_BIN=${MAMBA_ROOT_PREFIX:-$HOME/micromamba}/envs/pdal/bin/pdal" >> "$GITHUB_ENV"
      - name: Write helper
        run: |
          cat > /tmp/run.sh <<'SH'
          # usage: run.sh <stage> ; runs that stage for every requested course
          stage="$1"
          mkdir -p build-logs
          for slug in $(grep -v '^\s*#' BUILD_REQUEST.txt | tr -d '\r' | awk 'NF'); do
            log="build-logs/${slug}.log"
            [ "$stage" = surface ] && : > "$log"
            step() { local lim="$1"; shift; echo "--- $* (limit ${lim})" | tee -a "$log"; timeout "$lim" python3 "$@" >>"$log" 2>&1 || echo "!!! FAILED or timed out: $*" | tee -a "$log"; }
            case "$stage" in
              surface)
                step 6m  tools/fetch_osm_features.py --course "$slug"
                step 6m  tools/fetch_lidar.py --course "$slug" --only dem
                step 6m  tools/fetch_naip_clip.py --course "$slug"
                step 5m  tools/merge_clip_dem.py --course "$slug"
                step 5m  tools/derive_terrain.py --course "$slug"
                step 3m  tools/render_osm_features.py --course "$slug"
                step 10m tools/build_hole_data.py --course "$slug"
                step 3m  tools/coverage_report.py --course "$slug" ;;
              trees)
                step 20m tools/fetch_points_ept.py --course "$slug"
                ls courses/"$slug"/sources/point_cloud/*.laz >/dev/null 2>&1 || step 35m tools/fetch_lidar.py --course "$slug" --only lpc --max-tiles 12
                step 15m tools/build_chm.py --course "$slug"
                step 10m tools/detect_trees.py --course "$slug"
                step 10m tools/build_hole_data.py --course "$slug"
                step 5m  tools/build_goose_payload.py --course "$slug"
                step 3m  tools/coverage_report.py --course "$slug"
                du -sh "courses/${slug}/sources" 2>/dev/null | tee -a "$log" || true ;;
            esac
          done
          git config user.name "goose-course-builder"
          git config user.email "actions@users.noreply.github.com"
          for pat in 'courses/*/derived/*.json' 'courses/*/derived/*.geojson' 'courses/*/derived/*.md' 'courses/*/derived/*.png' \
                     'courses/*/derived/dem_clipped.tif' 'courses/*/derived/canopy_height_model.tif' 'courses/*/derived/slope.tif'; do
            git add -f $pat 2>/dev/null || true   # one pattern at a time: a missing file must not block the rest
          done
          git add courses/*/notes courses/*/goose_payload.json courses/*/goose_upsert.sql build-logs 2>/dev/null || true
          git commit -q -m "Build results ($stage): $(grep -v '^\s*#' BUILD_REQUEST.txt | awk 'NF' | tr '\n' ' ')" || echo "nothing to commit"
          git pull -q --rebase || true
          git push -q
          SH
      - name: Surface layers (map, elevation, imagery, terrain) — saved first
        run: bash /tmp/run.sh surface
      - name: Trees (lidar point clouds) — slow, time-limited
        run: bash /tmp/run.sh trees
