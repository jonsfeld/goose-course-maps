course_memory_rules:
  - pattern: "Holes 2, 4, 6, 8 are the four hardest — expect bogey-or-worse exposure if off your game"
    confidence: high
    sources:
      - "Greenskeeper reviewer roarksown1 (stated twice)"
      - "Multiple other reviewers"

  - pattern: "Hole 4 and Hole 6 reward clubbing DOWN off the tee (lay up / short-iron) — architect-intended risk/reward"
    confidence: medium
    sources:
      - "GolfGreatly (H4 cross bunker, H6 tight fairway)"

  - pattern: "Hole 2 and Hole 8 reward maximum distance — uphill/long and forced-carry respectively"
    confidence: high
    sources:
      - "GolfGreatly + multi-reviewer"

  - pattern: "Walking-only course — conserve energy on uphill holes (2, 5, 7)"
    confidence: medium
    sources: ["SCGA listing", "GolfGreatly terrain descriptions"]

  - pattern: "Tee boxes are firm/grassless — don't expect to plug a tee; bring a tee-peg-friendly pre-shot routine"
    confidence: high
    sources: ["GolfGreatly", "Greenskeeper roarksown1, t8fish, dangerousbri"]

  - pattern: "Downhill holes (6, 9) amplify distance — always club down"
    confidence: high
    sources: ["GolfGreatly (H6 short iron)", "GolfGreatly (H9 rattlesnake-long warning)"]

  - pattern: "Uphill holes (1, 2, 5, 7) play long — add club relative to yardage"
    confidence: high
    sources: ["Our LiDAR terrain data + reviewer corroboration on H2 + H7"]

  - pattern: "Greens are the strong point of the course when maintained; medium speed"
    confidence: high
    sources: ["GolfGreatly", "Multiple Greenskeeper reviewers"]

  - pattern: "Dogleg directions: H4=right, H5=left, H8=right"
    confidence: high
    sources: ["Richie's World 2013 (pre-reno, routing unchanged)", "GolfGreatly (H5, H8)"]

# =========================================================================
# Summary of what's in vs out of this draft
# =========================================================================

summary:
  populated_with_research_backing:
    high_confidence: [hole 2 strategy, hole 4 cross bunker, hole 6 short-iron strategy, hole 8 demanding tee shot, hole 9 rattlesnake, course-level architect intent]
    medium_confidence: [hole 1 narrative, hole 3 features, hole 5 carry strategy, hole 7 uphill humps, green characteristics generally]
  populated_with_geometry_only:
    - Green fall direction + magnitude (from our DEM gradient analysis)
    - Net elevation deltas per hole
    - Bunker counts (OSM) — FLAGGED for possible pre-renovation staleness
  honestly_empty:
    - Per-hole pin tendencies (zero public data)
    - Wind / prevailing direction
    - Firm/soft seasonality beyond generic
    - Green slope magnitudes beyond macro DEM gradient
    - Hole 1, 7 strategic specifics (reviewers say "unremarkable")

  user_review_checklist:
    - "[ ] Per hole: does the narrative match Roosevelt as you've played it?"
    - "[ ] Per hole: is the preferred_miss / danger_miss consistent with your memory?"
    - "[ ] Bunker count flag on H4 and H7 (OSM vs architect reality) — confirm or correct"
    - "[ ] Grass type conflict (bent vs poa) — can you resolve with ground-truth?"
    - "[ ] Hole 8 'observatory as aiming flag' — is that still accurate post-reno?"
    - "[ ] Anything I claim with 'medium' or 'low' confidence that you know first-hand"

  merge_plan_when_approved:
    - "Hole narratives → map.auto.md per-hole narrative block"
    - "course_strategy + green_intelligence → goose_payload.json hole_data[n]"
    - "landing_zones + approach_zones + miss_zones → map.auto.md + goose_payload.json"
    - "course_memory_rules → goose_payload.json course_intelligence.course_memory_rules"
    - "Regenerate goose_upsert.sql from updated goose_payload.json"
