---
# =========================================================================
# Roosevelt Municipal GC — Phase D Strategy Draft
# =========================================================================
# STATUS:  draft — pending user approval, not merged into map.auto.md
# LAYER:   complementary to Phase B/C/E outputs (2D geometry + LiDAR terrain)
# PURPOSE: strategic narrative + landing/approach/miss zones per hole,
#          research-backed with source URLs + confidence tags per claim.
#
# Merge-target fields (when approved):
#   - map.auto.md → per-hole narrative + strategy block
#   - goose_payload.json.hole_data[n].course_strategy
#   - goose_payload.json.hole_data[n].green_intelligence
#   - goose_payload.json.course_intelligence.course_memory_rules
#
# Research base: notes/strategy_research.md
# Generated: 2026-04-21
# Pipeline: manual:phase_d_v0
#
# Confidence legend:
#   high   = 2+ concurring sources, or architect statement, or corroborated by
#            our geometry/terrain data
#   medium = 1 credible source + geometric plausibility, or 2 casual sources
#   low    = 1 casual source OR pure geometric inference with no reviewer input
#   absent = no claim made (honest gap)
# =========================================================================

meta:
  status: draft_pending_user_approval
  generated: 2026-04-21
  course_slug: roosevelt_la
  pipeline: manual:phase_d_v0
  research_base: notes/strategy_research.md
  overall_confidence: medium
  overall_confidence_note: >
    Single primary hole-by-hole source (GolfGreatly post-renovation review,
    2021). Reviewer chorus confirms overall course themes. Holes 2/4/6/8
    have best coverage; holes 1/3/5/7/9 are thinner and rely more heavily
    on architect-intent quotes + our own geometry/terrain data.
  known_gaps:
    - Per-hole green slope magnitudes (only directions inferred from DEM)
    - Pin placement tendencies (zero public data)
    - Wind behaviour / prevailing direction (not in any golf source)
    - Firm/soft seasonality (one casual note only)
    - Hole-1, hole-7 strategic specifics (reviewers say "straightforward" / "not notable")
  conflicts_flagged:
    - Grass type (bent per GolfPass vs. poa annua per reviewer) — needs ground-truth
    - OSM bunker count (10) vs. architect-stated total (5) — OSM may include pre-renovation
      bunkers that Richardson removed in 2019; flag each bunker until field-verified

# =========================================================================
# Course-level character (high confidence, architect + multi-reviewer)
# =========================================================================

course_character:
  personality: >
    Walking-only hilly 9-hole muni tucked into the south end of Griffith
    Park. Par 33, 2,496 yd from the Black tees — small by yardage, but the
    drama is entirely in the terrain. Architect intent (Forrest Richardson,
    2019 restoration): "The defence of the course is all about the natural
    terrain and the drama you get from playing up, down and around."

  hardest_holes: [2, 4, 6, 8]
  hardest_holes_confidence: high
  hardest_holes_source: >
    Greenskeeper reviewer roarksown1 (stated across 2 reviews) + echoed by
    other reviewers.

  defining_features:
    - claim: "Only 5 bunkers total post-renovation"
      confidence: high
      source: Forrest Richardson firm announcement (Jan 2019)
      url: https://www.forrestrichardsongolf.com/city-of-los-angeles-restores-roosevelt-golf-course/
    - claim: "No water hazards anywhere on the course"
      confidence: medium
      source: "Richie's World of Golf (2013, pre-reno) + reno scope did not add water; corroborated by our OSM query returning zero water polygons"
    - claim: "Trees isolate each hole — tight tree-lined corridors"
      confidence: medium
      source: Multiple TripAdvisor/GolfPass mentions; corroborated by our CHM showing dense canopy
    - claim: "Tee boxes are the weak point — poor grass, firm soil"
      confidence: high
      source: GolfGreatly + multiple Greenskeeper reviewers (roarksown1, t8fish, dangerousbri)
    - claim: "Greens roll better than typical LA muni when maintained; medium speed"
      confidence: high
      source: GolfGreatly + Greenskeeper reviewers t8fish (07/2024), Itslikeimsayin (04/2024)

  conditions:
    green_speed: medium
    green_speed_confidence: high
    green_firmness: medium
    green_firmness_confidence: low  # single casual mention
    grass:
      fairway: bermuda
      fairway_confidence: high
      green: "conflicting — bent (GolfPass) vs poa annua (reviewer). Most LA munis run poa. Flag for ground-truth."
      green_confidence: conflicting
    wind:
      description: "No authoritative golf-source description of prevailing direction or canyon effect"
      confidence: absent
      policy: "do not synthesise; wind is runtime input only per schema principle"

  architect_quotes:
    - >
      "The defence of the course is all about the natural terrain and the
      drama you get from playing up, down and around."
      — Forrest Richardson (GCA article)
    - >
      "The last thing Roosevelt needs is an abundance of bunkers to make it
      interesting."
      — Forrest Richardson (GCA article)
    - >
      "The course doesn't make you feel as if you've hiked the Alps, yet
      you become totally lost in the hills."
      — Forrest Richardson (GCA article)

  renovation:
    architect: "Forrest Richardson (ASGCA)"
    year: 2019
    scope: "Better Billy Bunker installation, new forward tees, green restoration to original configurations, recycled-water irrigation"
    source: https://www.forrestrichardsongolf.com/projects/roosevelt-golf-course-griffith-park-california/

  bunker_count_anomaly:
    osm_count: 10
    architect_stated_count: 5
    resolution: >
      OSM likely contains pre-2019 bunker polygons that Richardson removed
      during consolidation. Each bunker feature should carry a
      `may_be_preren` flag until field-verified against current Google
      Earth imagery or on-course walkthrough.
    action: >
      Goose should treat OSM bunker polygons as "probable" rather than
      "confirmed" until verified. For strategy purposes, avoid calling out
      individual bunker positions that disagree with architect-documented
      renovated bunkers (cross bunker on H4; greenside bunkers on H1 left
      and H3 short-left; others TBD).

