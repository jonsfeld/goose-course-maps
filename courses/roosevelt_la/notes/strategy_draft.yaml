    narrative: >
      One of the most unusual and memorable par 4s around. The tee shot
      requires a solid 215-yd strike up the hill, past trees encroaching
      from the right, to a hilltop aiming flag — at which point the
      fairway turns sharply down to the right. Miss right and you're up
      a steep hillside with a blind pitch-out; miss left risks OB. Griffith
      Observatory is visible from the hole as a rough aiming reference.
      Reviewers consistently cite this as the hardest hole on the course
      (handicap 1).

    course_strategy:
      hole_type: dogleg_right_blind_tee
      hole_personality: "demanding — hit the aiming flag or suffer"
      tee_strategy:
        preferred_club: "driver / 3-wood — 215 yd minimum required"
        rationale: "Must carry the hill + trees right to reach the turn; any less and you're blocked or on the hillside"
        confidence: high
      approach_strategy:
        primary_target: "right-center of green"
        preferred_miss: right   # slope kicks left, approach drifts left and runs hot
        danger_miss: left   # downhill approaches drift left
        green_slope_bias: "NW fall (0.35°), but approach is strongly downhill — balls run hot"
        confidence: high
      miss_hierarchy:
        safe: "center (straight up the aiming flag)"
        risky: "right off tee = stuck uphill with blind pitch; left off tee = OB; approach left = runs hot"
