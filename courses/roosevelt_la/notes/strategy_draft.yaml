      approach_strategy:
        primary_target: center_green
        preferred_miss: right
        danger_miss: left   # bunker
        green_slope_bias: "slight fall NE (0.5° from LiDAR — not material)"
        confidence: medium
      miss_hierarchy:
        safe: "short or right"
        risky: "left (bunker); long downhill past green"
      confidence: medium
      sources:
        - "GolfGreatly review: https://www.golfgreatly.com/golf-course-reviews/roosevelt-golf-course"

    green_intelligence:
      size: unknown
      shape: unknown
      firmness: medium   # course-level default
      safe_miss: right
      dangerous_miss: left   # bunker
      pin_tendency: unknown
      confidence: low

